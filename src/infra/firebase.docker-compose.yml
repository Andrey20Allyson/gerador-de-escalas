version: "3.8"

services:
  firestore:
    image: google/cloud-sdk:emulators
    container_name: firestore-emulator
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8080
    ports:
      - "8080:8080"
    environment:
      - FIRESTORE_EMULATOR_HOST=0.0.0.0:8080
    networks:
      - firestore-network

  firestore-2:
    image: google/cloud-sdk:emulators
    container_name: firestore-emulator-2
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8081
    ports:
      - "8081:8081"
    environment:
      - FIRESTORE_EMULATOR_HOST=0.0.0.0:8081
    networks:
      - firestore-network

networks:
  firestore-network:
    driver: bridge
